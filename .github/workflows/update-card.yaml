---
# Keeps the bundled scrypted-camera-card in step with its own repository.
#
# Polls the card repository for its latest full release instead of being
# triggered from it: the card stays unaware of this integration (it also works
# with koush/ha_scrypted), and no token has to be shared between the two
# repositories.
name: Update bundled card

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Card release tag (vX.Y.Z); empty for the latest release"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-card
  cancel-in-progress: false

jobs:
  update:
    name: Vendor the latest card release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CARD_REPOSITORY: raphael1688dev/scrypted-camera-card
      REQUESTED_TAG: ${{ inputs.tag }}
      CARD_MODULE: custom_components/scrypted/card.py
    steps:
      - uses: actions/checkout@v4

      - name: Find the release to vendor
        id: release
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            # "latest" never names a prerelease or a draft.
            tag=$(gh api "repos/$CARD_REPOSITORY/releases/latest" \
              --jq .tag_name)
          fi
          current=$(sed -n 's/^CARD_VERSION = "\(.*\)"$/\1/p' "$CARD_MODULE")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=card/$tag" >> "$GITHUB_OUTPUT"
          if [ "v$current" = "$tag" ]; then
            echo "Bundled card is already $tag."
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "card/$tag" \
            > /dev/null; then
            echo "Branch card/$tag exists: its PR is open or was declined."
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updating the bundled card from v$current to $tag."
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.14
        if: steps.release.outputs.update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Vendor the release
        if: steps.release.outputs.update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/update_card.py "$TAG"

      # Pull requests opened with the workflow token do not start other
      # workflows, so the checks that would normally gate the PR run here.
      - name: Run tests
        if: steps.release.outputs.update == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pytest

      - name: Open a pull request
        if: steps.release.outputs.update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$CARD_MODULE" custom_components/scrypted/frontend
          git commit -m "Update the bundled scrypted-camera-card to $TAG"
          git push origin "$BRANCH"
          release="https://github.com/$CARD_REPOSITORY/releases/tag/$TAG"
          {
            echo "Vendors $release with scripts/update_card.py."
            echo
            echo "The test suite passed in the workflow run that opened this"
            echo "pull request. The usual pull request checks do not start"
            echo "for pull requests opened by a workflow."
          } > "$RUNNER_TEMP/body.md"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH" \
            --title "Update the bundled scrypted-camera-card to $TAG" \
            --body-file "$RUNNER_TEMP/body.md"
